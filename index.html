  :root {
    /* cores prioritárias do manual */
    --bg:     #231104;
    --brown:  #4f2709;
    --tan:    #bc6320;
    --accent: #ff8b00;
    --ink:    #f9f7e1;

    --font-display: "Monument", "Archivo", "Arial Narrow", system-ui, sans-serif;
    --font-text:    "Archivo", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;

    /* margem lateral e ritmo vertical em rem + vw:
       o site se comporta igual numa janela curta, num monitor
       grande ou num celular — nada depende só da altura da tela */
    --pad-x: clamp(1.5rem, 5.5vw, 7rem);
    --flow:  clamp(2.75rem, 2rem + 3.4vw, 5.25rem);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
    overflow-x: hidden;
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-text);
    font-weight: 400;
    font-size: clamp(1rem, 0.96rem + 0.25vw, 1.12rem);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 1px; }
  svg { display: block; max-width: 100%; }

  /* uma única coluna, centrada, com teto de largura: em monitores
     grandes o conteúdo não se espalha nem encosta na borda */
  .wrap {
    width: min(100%, 1560px);
    margin-inline: auto;
    padding-inline: max(var(--pad-x), env(safe-area-inset-left));
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------------- topo: logo prioritário ---------------- */
  .site-head { padding-top: clamp(1.4rem, 1rem + 1.6vw, 2.4rem); }

  .brand { display: inline-block; color: var(--ink); transition: color .3s ease; }
  .brand:hover, .brand:focus-visible { color: var(--accent); }
  .brand__logo {
    width: auto;
    height: clamp(54px, 3rem + 2.2vw, 82px);
  }

  /* ---------------- hero ---------------- */
  /* o logo e o "IFÁ" ficam colados: um bloco só no alto da página */
  .hero {
    padding-top: clamp(0.75rem, 0.5rem + 1vw, 1.75rem);
  }

  /* o logotipo e o símbolo laranja dividem a mesma linha:
     "IFÁ" na coluna de texto, símbolo alinhado à direita,
     ambos centrados no mesmo eixo horizontal */
  .hero__lockup {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(1.5rem, 4vw, 5rem);
  }

  .hero__title { margin: 0; }
  .hero__word {
    width: auto;
    height: clamp(112px, 3.5rem + 23vw, 420px);
    color: var(--ink);
  }

  .hero__symbol {
    flex: none;
    width: clamp(56px, 2.6rem + 4.6vw, 152px);
    height: auto;
    color: var(--accent);
  }

  /* a única declaração da página — Archivo medium,
     escala de subtítulo conforme a hierarquia do manual.
     Três linhas lêem como estrofe, não como manchete. */
  .hero__statement {
    font-family: var(--font-text);
    font-weight: 500;
    font-size: clamp(1.08rem, 0.92rem + 1.1vw, 1.85rem);
    line-height: 1.38;
    letter-spacing: -0.005em;
    margin: clamp(1.4rem, 1rem + 1.8vw, 2.6rem) 0 0;
    max-width: 30ch;
  }

  /* ---------------- grafismo ---------------- */
  /* A fissura atravessa a página na diagonal, entrando por uma borda
     e saindo pela outra. É o gesto que dá ritmo ao layout — o conteúdo
     em si permanece todo alinhado numa coluna só. */
  .page {
    position: relative;
    overflow: hidden;
  }

  /* as fitas do manual, grossas e espacadas, ampliadas o bastante
     para entrarem por uma borda e sairem pela outra */
  .grafismo path:nth-of-type(n+3) { display: none; }
  .grafismo {
    position: absolute;
    top: 60%;
    right: -30%;
    transform: translateY(-50%) rotate(8deg);
    width: min(230vw, 3050px);
    height: auto;
    color: var(--tan);
    opacity: 0.75;
    z-index: 0;
    pointer-events: none;
  }
  .grafismo path { stroke-width: 2.5; }

  /* todo o conteúdo passa por cima do grafismo */
  .page > *:not(.grafismo) { position: relative; z-index: 1; }

  /* ---------------- contato ---------------- */
  .contact { margin-top: calc(var(--flow) * 1.35); }

  .contact__email {
    display: inline-block;
    position: relative;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.28rem, 0.6rem + 2.7vw, 3.2rem);
    line-height: 1.1;
    color: var(--ink);
    overflow-wrap: break-word;
    transition: color .3s ease;
  }
  .contact__email::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -0.12em;
    height: 2px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .contact__email:hover, .contact__email:focus-visible { color: var(--accent); }
  .contact__email:hover::after, .contact__email:focus-visible::after { transform: scaleX(1); }

  address { font-style: normal; }

  .social {
    list-style: none;
    margin: clamp(2rem, 1.4rem + 2.2vw, 3.6rem) 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1.8rem;
    font-weight: 500;
    font-size: clamp(0.78rem, 0.74rem + 0.18vw, 0.9rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .social a {
    display: inline-block;
    padding: 7px 1px;
    color: rgba(249, 247, 225, 0.62);
    transition: color .3s ease, transform .3s ease;
  }
  .social a:hover, .social a:focus-visible {
    color: var(--accent);
    transform: translateX(2px);
  }

  /* ---------------- rodapé ---------------- */
  .colophon {
    margin-top: var(--flow);
    padding-bottom: max(clamp(2.5rem, 2rem + 3vw, 5rem), env(safe-area-inset-bottom));
    font-size: clamp(0.72rem, 0.7rem + 0.12vw, 0.82rem);
    letter-spacing: 0.06em;
    color: rgba(249, 247, 225, 0.46);
  }
  .colophon p { margin: 0; }

  /* ---------------- entrada discreta ---------------- */
  .rise { opacity: 0; transform: translateY(12px); }
  .rise.in {
    opacity: 1; transform: none;
    transition: opacity 1s ease, transform 1s cubic-bezier(.2,.7,.2,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .rise.in { opacity: 1 !important; transform: none !important; transition: none !important; }
  }

  /* ---------------- telas estreitas ---------------- */
  @media (max-width: 700px) {
    .grafismo { right: -45%; width: 300vw; opacity: 0.6; }
    .social { gap: 0.5rem 1.6rem; }
  }

  /* janelas largas e baixas: encurta o ritmo para o conteúdo

<script>
  (function () {
    var items = [].slice.call(document.querySelectorAll(".rise"));
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduce || !("IntersectionObserver" in window)) {
      items.forEach(function (el) { el.classList.add("in"); });
      return;
    }

    var above = items.filter(function (el) {
      return el.getBoundingClientRect().top < window.innerHeight * 0.92;
    });
    above.forEach(function (el, i) { el.style.transitionDelay = (0.08 + i * 0.08) + "s"; });

    function revealAbove() { above.forEach(function (el) { el.classList.add("in"); }); }
    requestAnimationFrame(revealAbove);
    setTimeout(revealAbove, 600);

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("in");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2, rootMargin: "0px 0px -10% 0px" });

    items.forEach(function (el) { if (above.indexOf(el) === -1) io.observe(el); });
  })();
</script>
